services:
  ota-volume-init:
    image: busybox:1.37
    restart: 'no'
    command: sh -c "mkdir -p /data/ota-bundles && chown -R 1001:1001 /data/ota-bundles"
    volumes:
      - ota_bundles:/data/ota-bundles
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Sized for the 8 GB, 2 vCPU host (t4g.large) that also runs the other services. The food
    # table and its indexes are about 1.6 GB and should stay in memory: Postgres's default
    # 128 MB of shared buffers pushes broad searches onto the disk.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=32MB
    # Docker's default 64 MB /dev/shm is too small for parallel queries.
    shm_size: 512mb
    environment:
      POSTGRES_DB: myfit
      POSTGRES_USER: myfit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myfit -d myfit']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # Constructed from POSTGRES_PASSWORD — do NOT set DATABASE_URL in the env file
      DATABASE_URL: postgresql://myfit:${POSTGRES_PASSWORD}@postgres:5432/myfit
      PORT: 3000
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_MODEL_ID: ${OPENAI_MODEL_ID}
      OTA_UPLOAD_KEY: ${OTA_UPLOAD_KEY}
      OTA_BUNDLES_DIR: /data/ota-bundles
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    volumes:
      - ota_bundles:/data/ota-bundles
    depends_on:
      ota-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - internal
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.myfit-api.rule=Host(`${API_DOMAIN}`)'
      - 'traefik.http.routers.myfit-api.entrypoints=websecure'
      - 'traefik.http.routers.myfit-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.myfit-api.loadbalancer.server.port=3000'
      # Food search is the expensive endpoint and is public, so it gets its own router, with a
      # per-client rate limit that does not apply to sync and auth. The longer rule wins.
      - 'traefik.http.routers.myfit-search.rule=Host(`${API_DOMAIN}`) && PathPrefix(`/api/nutrition-data`)'
      - 'traefik.http.routers.myfit-search.entrypoints=websecure'
      - 'traefik.http.routers.myfit-search.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.myfit-search.service=myfit-api'
      - 'traefik.http.routers.myfit-search.middlewares=myfit-search-ratelimit'
      - 'traefik.http.middlewares.myfit-search-ratelimit.ratelimit.average=10'
      - 'traefik.http.middlewares.myfit-search-ratelimit.ratelimit.burst=30'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # PUBLIC_* vars are baked into the static bundle at build time
        PUBLIC_API_URL: ${PUBLIC_API_URL}
        PUBLIC_POSTHOG_KEY: ${PUBLIC_POSTHOG_KEY}
        PUBLIC_POSTHOG_HOST: ${PUBLIC_POSTHOG_HOST}
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.myfit-frontend.rule=Host(`${FRONTEND_DOMAIN}`)'
      - 'traefik.http.routers.myfit-frontend.entrypoints=websecure'
      - 'traefik.http.routers.myfit-frontend.tls.certresolver=letsencrypt'
      - 'traefik.http.services.myfit-frontend.loadbalancer.server.port=80'

volumes:
  postgres_data:
  ota_bundles:

networks:
  internal:
  dokploy-network:
    external: true
