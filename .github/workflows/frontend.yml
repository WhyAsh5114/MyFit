name: Frontend CI

on:
  push:
    paths:
      - 'apps/frontend/**'
      # The frontend imports the API's types and shared constants.
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.gitignore'
      - '.github/workflows/frontend.yml'

# A newer push to the same branch makes the older run obsolete. Runs on the deploy
# branches finish, so a superseded OTA upload is never cut off halfway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v4-turborepo' }}

jobs:
  ci:
    name: Lint / Check / Test / Build
    runs-on: ubuntu-latest
    outputs:
      # The OTA channel of this build: the bundle is published where only apps built for the
      # same Capacitor core look for updates.
      ota-channel: ${{ steps.channel.outputs.value }}
    env:
      PUBLIC_API_URL: http://localhost:3000
      PUBLIC_POSTHOG_KEY: test_key
      PUBLIC_POSTHOG_HOST: https://test.posthog.com

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Paraglide messages
        run: pnpm --filter @myfit/frontend exec paraglide-js compile --project ./project.inlang --outdir ./src/lib/paraglide

      - name: Lint & format check
        run: pnpm --filter @myfit/frontend run lint

      - name: Type check
        run: pnpm --filter @myfit/frontend run check

      - name: Test
        run: pnpm --filter @myfit/frontend run test

      - name: Build
        if: github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v4-turborepo'
        run: pnpm --filter @myfit/frontend run build

      - name: Build API-backed artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v4-turborepo'
        run: |
          if [ -z "$PUBLIC_API_URL" ]; then
            echo "OTA_API_URL secret is required to build the API-backed artifact"
            exit 1
          fi
          pnpm --filter @myfit/frontend run build
        env:
          PUBLIC_API_URL: ${{ secrets.OTA_API_URL }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - name: Resolve OTA channel
        id: channel
        run: echo "value=$(pnpm --silent --filter @myfit/frontend run ota:channel)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v4-turborepo'
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: apps/frontend/build/

  e2e:
    name: End-to-end
    # Pinned: Playwright 1.60 cannot install Chromium on Ubuntu 26.04, which `ubuntu-latest` now is.
    runs-on: ubuntu-24.04
    env:
      TEST_DATABASE_URL: postgresql://myfit:password@localhost:5432/myfit
      PUBLIC_POSTHOG_KEY: e2e

    services:
      # The version production runs, so the migrations match.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myfit
          POSTGRES_USER: myfit
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # Playwright starts the API with Bun.
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @myfit/frontend exec playwright install --with-deps chromium

      - name: Migrate the test database
        run: pnpm --filter @myfit/shared run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: End-to-end tests
        run: pnpm --filter @myfit/frontend run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/frontend/playwright-report/
            apps/frontend/test-results/

  ota:
    name: OTA Upload
    runs-on: ubuntu-latest
    needs: [ci, e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/v4-turborepo'
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: frontend-build
          path: apps/frontend/build/

      - name: Upload OTA bundle
        run: |
          cd apps/frontend/build
          zip -r ../ota-bundle.zip . -x '*.DS_Store'
          cd ..
          CHECKSUM=$(sha256sum ota-bundle.zip | awk '{print $1}')
          echo "Bundle SHA-256: $CHECKSUM"
          HTTP_CODE=$(curl -s -o /dev/stderr -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${OTA_UPLOAD_KEY}" \
            -F "file=@ota-bundle.zip" \
            -F "channel=${OTA_CHANNEL}" \
            "${OTA_API_URL}/api/ota/upload")
          if [ "$HTTP_CODE" -ne 201 ]; then
            echo "OTA upload failed with HTTP $HTTP_CODE"
            exit 1
          fi
          echo "OTA bundle uploaded successfully!"
        env:
          OTA_API_URL: ${{ secrets.OTA_API_URL }}
          OTA_UPLOAD_KEY: ${{ secrets.OTA_UPLOAD_KEY }}
          OTA_CHANNEL: ${{ needs.ci.outputs.ota-channel }}
