name: API CI

on: push

jobs:
  ci:
    name: Lint / Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm --filter @myfit/api run lint

      - name: Type check
        run: pnpm turbo run check --filter=@myfit/api

      - name: Build
        run: pnpm --filter @myfit/api run build
