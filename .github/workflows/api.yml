name: API CI

on:
  push:
    paths:
      - 'apps/api/**'
      # The root ESLint config imports the frontend's Svelte config and ignore file,
      # and the root Prettier config reads the frontend's Tailwind stylesheet.
      - 'apps/frontend/svelte.config.js'
      - 'apps/frontend/.gitignore'
      - 'apps/frontend/src/routes/layout.css'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'eslint.config.js'
      - '.prettierrc'
      - '.gitignore'
      - '.github/workflows/api.yml'

# A newer push to the same branch makes the older run obsolete. Runs on the deploy
# branches always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/v4-turborepo' }}

jobs:
  ci:
    name: Lint / Test / Build
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://myfit:password@localhost:5432/myfit

    services:
      # The version production runs, so the migrations and the search extensions match.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myfit
          POSTGRES_USER: myfit
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myfit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint & format check
        run: pnpm --filter @myfit/api run lint

      - name: Type check
        run: pnpm turbo run check --filter=@myfit/api

      - name: Migrate the test database
        run: pnpm --filter @myfit/schema run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Test
        run: pnpm --filter @myfit/api run test

      - name: Build
        run: pnpm --filter @myfit/api run build
