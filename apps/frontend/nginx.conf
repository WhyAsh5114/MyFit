server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ends at the proxy, so a redirect nginx builds itself would say http:// and the browser
    # would block it. Keep redirects relative.
    absolute_redirect off;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1000;

    # Long-lived cache for hashed assets
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A prerendered page (`/hi` → hi.html) before its folder (`hi/` holds hi/login.html), which
    # would otherwise redirect to `/hi/`. Every other path gets the SPA shell.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
