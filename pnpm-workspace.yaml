packages:
  - apps/*
  - packages/*

overrides:
  '@types/node': ^25.3.0
  tar: '>=7.5.13'
  minimatch: '>=10.2.5'
  '@xmldom/xmldom': '>=0.9.10'
  '@hono/node-server': '>=2.0.1'
  cookie: '>=1.1.1'

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp

allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
