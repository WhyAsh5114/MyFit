packages:
  - apps/*
  - packages/*

overrides:
  '@types/node': ^25.3.0
  tar: '>=7.5.21'
  minimatch: '>=10.2.5'
  '@hono/node-server': '>=2.0.10'
  deepmerge-ts@7: ^8.0.0
  esbuild@0.27: ^0.28.1
  hono@4: ^4.13.13
  lodash@4: ^4.17.24
  mysql2@3: ^3.23.1
  postcss-selector-parser@6: ^7.1.6
  postcss-selector-parser@7: ^7.1.6
  sharp@0.32: ^0.35.5
  uuid@7: ^11.1.1
  valibot@1: ^1.4.2

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp

allowBuilds:
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  workerd: false

minimumReleaseAgeExclude:
  - '@prisma-idb/*'
