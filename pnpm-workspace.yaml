packages:
  - apps/*
  - packages/*

overrides:
  '@types/node': ^25.3.0
  tar: '>=7.5.13'
  minimatch: '>=10.2.5'
  '@xmldom/xmldom': '>=0.9.10'
  '@hono/node-server': '>=2.0.1'
  cookie: '>=1.1.1'
  kysely: 0.28.17
  arktype: 2.2.8

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp

allowBuilds:
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  workerd: false

minimumReleaseAgeExclude:
  - '@prisma-idb/adapter-idb@0.15.1'
  - '@prisma-idb/client-idb@0.15.1'
  - '@prisma-idb/driver-idb@0.15.1'
  - '@prisma-idb/family-idb@0.15.1'
  - '@prisma-idb/runtime-idb@0.15.1'
  - '@prisma-idb/sync-extension-idb@0.10.1'
  - '@prisma-idb/sync-server-sql@0.8.2'
  - '@prisma-idb/sync-server@0.8.4'
  - '@prisma-idb/target-idb@0.15.1'
  - '@prisma-idb/client-idb@0.16.0'
  - '@prisma-idb/sync-extension-idb@0.11.0'
  - '@prisma-idb/sync-server@0.9.0'
  - '@prisma-idb/sync-server-sql@0.9.0'
  - '@prisma-idb/adapter-idb@0.16.0'
  - '@prisma-idb/driver-idb@0.16.0'
  - '@prisma-idb/family-idb@0.16.0'
  - '@prisma-idb/target-idb@0.16.0'
  - '@prisma-idb/runtime-idb@0.16.0'
