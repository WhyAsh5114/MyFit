services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: bash -c "sudo chmod 666 /dev/kvm 2>/dev/null || true && sleep infinity"

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db
    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - '5432:5432'
    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  # Object storage for chat photos. Independent of `db`, so it can run on its own for an API on
  # the host:  docker compose -f .devcontainer/docker-compose.yml up -d seaweedfs
  # The host reaches it at http://localhost:8333, the devcontainer at http://seaweedfs:8333.
  # It takes the key pair (S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY) from apps/api/.env.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/start.sh']
    env_file: ../apps/api/.env
    volumes:
      - ../infra/seaweedfs/start.sh:/start.sh:ro
      - seaweedfs-data:/data
    ports:
      - '127.0.0.1:8333:8333'

volumes:
  postgres-data:
  seaweedfs-data:
